<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · MultiSoftCreations</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <button type="button" class="back-btn" data-back data-back-fallback="../index.html" aria-label="Volver">
        <span class="back-arrow" aria-hidden="true">←</span>
      </button>

      <a href="../index.html" class="logo">
        <img src="../assets/img/logo.png" alt="MultiSoftCreations" class="logo-img" width="42" height="42">
        <span class="logo-text">Panel admin</span>
      </a>
      <button type="button" id="logout-btn" class="btn btn-secondary btn-sm">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <section class="section" id="login-view">
      <div class="container" style="max-width:420px">
        <h1 class="page-title">Acceso admin</h1>
        <p class="page-intro">Solo para el propietario del portafolio.</p>
        <form id="login-form" class="contact-form">
          <label>
            Correo
            <input type="email" name="email" required autocomplete="username">
          </label>
          <label>
            Contraseña
            <input type="password" name="password" required autocomplete="current-password">
          </label>
          <p id="login-status" class="form-status" hidden></p>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
      </div>
    </section>

    <section class="section" id="panel-view" hidden>
      <div class="container">
        <div class="section-header">
          <h1 class="page-title">Solicitudes</h1>
        </div>
        <p class="section-intro">Mensajes del formulario de contacto. Puedes responder, dar like, marcar leído o eliminar.</p>
        <div id="solicitudes-list" class="admin-list"></div>

        <h2 class="section-title" style="margin-top:3rem;font-size:1.35rem">Rangos de usuarios</h2>
        <p class="section-intro">Solo tú puedes asignar: Creador, Co-creador/a, Colaborador o Usuario. Se muestran junto a los comentarios.</p>
        <div id="ranks-list" class="admin-list"></div>
      </div>
    </section>
  </main>

  <script src="../javascript/main.js"></script>
  <script type="module" src="../javascript/admin.js"></script>
</body>
</html>
